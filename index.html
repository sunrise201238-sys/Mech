<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="重裝機體 03：會動的 3D 原型。可以轉動、播放十個動作、裝卸武器、換塗裝、改體型。">
<title>Heavy Mech Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Saira+Condensed:wght@500;600;700&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: the stage with the mech on the left, the controls as sheets of a field manual on the right. The mech stays in
   sight while any control is worked: a wide window is filled and only the controls scroll, in two columns where there is
   room for all of them at once; on a phone the stage holds to the top of the screen and the controls pass under it.
   One light theme, on purpose: drab paper, green-black ink, stencilled labels, one signal orange. */
:root {
  --paper: #E6E4DA; --sheet: #F2F0E8; --ink: #1D221E; --muted: #5A6158; --drab: #4D5834; --drab-deep: #363D25; --signal: #C9541F; --line: rgba(29, 34, 30, .28);
  --ui: 'Saira Condensed', 'Noto Sans TC', system-ui, sans-serif; --zh: 'Noto Sans TC', 'Saira Condensed', system-ui, sans-serif;
  --stencil: 'Saira Stencil One', 'Saira Condensed', 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--zh); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.wrap { max-width: 1760px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
.tab { background: var(--drab-deep); color: var(--sheet); padding: 8px 14px 6px; font: 400 15px/1 var(--stencil); letter-spacing: .14em; margin-bottom: -13px; align-self: flex-end; }
.title { flex: 1 1 320px; }
.title h1 { margin: 0; font: 900 clamp(24px, 3.6vw, 36px)/1.15 var(--zh); letter-spacing: .06em; text-wrap: balance; }
.title h1 span { font: 400 1.12em/1 var(--stencil); color: var(--signal); margin-left: .22em; letter-spacing: .02em; }
.title p { margin: 4px 0 2px; font: 500 14px/1.6 var(--zh); color: var(--muted); }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 16px; align-items: start; }
.stage { position: sticky; top: 10px; height: min(78vh, 780px); min-height: 420px; border: 2px solid var(--ink); overflow: hidden; background: #C9CDCB; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
/* corner marks, as on a drawing sheet */
.stage::after { content: ""; position: absolute; inset: 10px; pointer-events: none; opacity: .55;
  background: linear-gradient(var(--ink), var(--ink)) left top / 20px 2px no-repeat, linear-gradient(var(--ink), var(--ink)) left top / 2px 20px no-repeat,
    linear-gradient(var(--ink), var(--ink)) right top / 20px 2px no-repeat, linear-gradient(var(--ink), var(--ink)) right top / 2px 20px no-repeat,
    linear-gradient(var(--ink), var(--ink)) left bottom / 20px 2px no-repeat, linear-gradient(var(--ink), var(--ink)) left bottom / 2px 20px no-repeat,
    linear-gradient(var(--ink), var(--ink)) right bottom / 20px 2px no-repeat, linear-gradient(var(--ink), var(--ink)) right bottom / 2px 20px no-repeat; }
.now { position: absolute; left: 22px; top: 22px; background: var(--ink); color: var(--sheet); padding: 6px 12px 5px; font: 700 14px/1.3 var(--zh); letter-spacing: .08em; pointer-events: none; }
.hint { position: absolute; right: 22px; bottom: 20px; font: 500 12px/1.4 var(--zh); color: var(--ink); background: rgba(242, 240, 232, .82); padding: 3px 9px; pointer-events: none; }

.panel, .col { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--sheet); border: 2px solid var(--ink); padding: 0 14px 14px; }
.card h2 { margin: 0 0 12px -14px; display: table; background: var(--ink); color: var(--sheet); padding: 5px 14px 4px; font: 700 14px/1.2 var(--zh); letter-spacing: .16em; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; }
.pill { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; background: transparent; border: 2px solid var(--ink); padding: 7px 12px 6px; min-height: 38px; text-align: left; }
.pill b { font: 700 15px/1.2 var(--zh); } .pill i { font: 600 12px/1 var(--ui); font-style: normal; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.pill:hover { background: rgba(77, 88, 52, .14); }
.pill.on { background: var(--drab-deep); color: var(--sheet); box-shadow: inset 0 -4px 0 var(--signal); } .pill.on i { color: #C9CEB8; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 42px; align-items: center; gap: 10px; margin-top: 10px; font: 700 14px/1.2 var(--zh); }
.row output { font: 600 15px/1 var(--ui); font-variant-numeric: tabular-nums; text-align: right; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--ink); }
input[type="range"]::-moz-range-track { height: 4px; background: var(--ink); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 24px; margin-top: -10px; background: var(--signal); border: 2px solid var(--ink); border-radius: 0; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 20px; background: var(--signal); border: 2px solid var(--ink); border-radius: 0; }
.line { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; } h2 + .line { margin-top: 0; }
.chip { background: transparent; border: 2px solid var(--ink); padding: 7px 13px 6px; min-height: 38px; font: 700 13px/1.2 var(--zh); letter-spacing: .06em; }
.chip:hover { background: rgba(77, 88, 52, .14); } .chip.on { background: var(--drab); color: var(--sheet); }
.pill:disabled, .pill:disabled:hover { opacity: .36; cursor: default; background: transparent; color: var(--ink); box-shadow: none; }
/* the weapons: a name that plays the motion bound to it, and a switch that mounts it or takes it off */
.arms { display: grid; gap: 6px; }
.arm { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.arm .chip { min-height: 38px; }
/* a weapon's name over it, when the weapons are laid out */
.tag { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--sheet); padding: 4px 10px 3px; font: 700 13px/1.3 var(--zh); letter-spacing: .08em; white-space: nowrap; pointer-events: none; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sw { display: grid; grid-template-columns: 20px 20px 12px 1fr; align-items: center; gap: 0; background: transparent; border: 2px solid var(--ink); padding: 8px 10px; min-height: 44px; }
.sw span { height: 24px; border: 2px solid var(--ink); margin-right: -2px; } .sw span:nth-child(3) { margin-right: 0; }
.sw em { font: 700 14px/1 var(--zh); font-style: normal; text-align: right; letter-spacing: .1em; }
.sw:hover { background: rgba(77, 88, 52, .14); }
.sw.on { background: var(--drab-deep); color: var(--sheet); box-shadow: inset 0 -4px 0 var(--signal); } .sw.on span { border-color: var(--sheet); }
textarea { width: 100%; resize: none; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); padding: 8px 10px; font: 600 14px/1.45 var(--ui); letter-spacing: .02em; }
.stat { margin: 10px 0 0; font: 500 12.5px/1.7 var(--zh); color: var(--muted); }
.stat span { white-space: nowrap; margin-right: .9em; }
body.bare .top, body.bare .panel, body.bare .now, body.bare .hint, body.bare .stage::after { display: none; }
body.bare .wrap { padding: 0 !important; max-width: none; } body.bare .board { display: block; } body.bare .stage { height: 100vh; border: 0; }

/* a wide window: the board fills it, the stage takes all the height there is, and the controls scroll on their own */
@media (min-width: 901px) and (min-height: 540px) {
  html, body { height: 100%; overflow: hidden; }
  .wrap { height: 100vh; height: 100dvh; padding-block: 12px 14px; }
  .title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 20px; } .title p { margin: 0; }
  .board { flex: 1 1 auto; min-height: 0; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
  .stage { position: relative; top: 0; height: auto; min-height: 0; }
  .panel { width: 348px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
}
/* wider still: the controls in two columns, so that all of them are in sight at once */
@media (min-width: 1400px) and (min-height: 540px) {
  .panel { width: auto; display: grid; grid-template-columns: repeat(2, 330px); gap: 16px; align-content: start; align-items: start; }
}
@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .stage { top: 0; z-index: 3; height: 46vh; height: 46dvh; min-height: 300px; }
  .wrap { padding-block: 12px 24px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="tab">MECH BOARD</div>
    <div class="title">
      <h1>重裝機體<span>03</span></h1>
      <p>會動的 3D 原型，軍用傾斜裝甲。拖著轉、點動作、裝卸武器、換塗裝、拉滑桿改體型。</p>
    </div>
  </header>
  <main class="board">
    <section class="stage" aria-label="機體展示">
      <canvas id="view"></canvas>
      <div class="now" id="now"></div>
      <div class="hint">拖曳旋轉，滾輪或雙指縮放</div>
    </section>
    <aside class="panel">
      <div class="col">
        <section class="card">
          <h2>動作</h2>
          <div id="motions" class="grid"></div>
          <label class="row"><span>速度</span><input id="speed" type="range" min="0.2" max="1.5" step="0.05" value="1" aria-label="速度"><output id="speedOut">1.00</output></label>
          <div class="line">
            <button type="button" class="chip" data-toggle="tour">輪播</button>
            <button type="button" id="pause" class="chip">暫停</button>
            <button type="button" class="chip" data-toggle="fx">噴射</button>
          </div>
        </section>
        <section class="card">
          <h2>武器</h2>
          <div id="arms" class="arms"></div>
        </section>
        <section class="card">
          <h2>檢視</h2>
          <div class="line">
            <button type="button" class="chip" data-toggle="frame">骨架</button>
            <button type="button" class="chip" data-toggle="rack">陳列</button>
            <button type="button" class="chip" data-toggle="edges">稜線</button>
            <button type="button" class="chip" data-toggle="spin">轉盤</button>
          </div>
        </section>
      </div>
      <div class="col">
        <section class="card">
          <h2>體型</h2>
          <div id="sliders"></div>
          <div class="line"><button type="button" id="reset" class="chip">回到預設</button></div>
        </section>
        <section class="card">
          <h2>塗裝</h2>
          <div id="palettes" class="swatches"></div>
        </section>
        <section class="card">
          <h2>目前的數字</h2>
          <textarea id="nums" readonly rows="2" aria-label="目前的數字"></textarea>
          <div class="line"><button type="button" id="copy" class="chip">複製</button></div>
          <p id="stat" class="stat"></p>
        </section>
      </div>
    </aside>
  </main>
</div>
<script src="mech-board.js?v=669b99e5d1"></script>
</body>
</html>
