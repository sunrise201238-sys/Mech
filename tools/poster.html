<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Saira+Condensed:wght@600;700&family=Saira+Stencil+One&display=swap">
<style>
body { margin: 0; background: #E6E4DA; color: #1D221E; font-family: 'Noto Sans TC', sans-serif; width: 1320px; }
.wrap { padding: 26px 28px 28px; }
.top { display: flex; align-items: flex-end; gap: 18px; border-bottom: 3px solid #1D221E; padding-bottom: 10px; margin-bottom: 16px; }
.tab { background: #363D25; color: #F2F0E8; padding: 8px 14px 6px; font: 400 15px/1 'Saira Stencil One'; letter-spacing: .14em; margin-bottom: -13px; }
h1 { margin: 0; font: 900 34px/1.15 'Noto Sans TC'; letter-spacing: .06em; } h1 span { font: 400 1.12em/1 'Saira Stencil One'; color: #C9541F; margin-left: .22em; }
.sub { margin: 4px 0 2px; font: 500 15px/1.6 'Noto Sans TC'; color: #5A6158; }
.g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
figure { margin: 0; border: 2px solid #1D221E; overflow: hidden; background: #C9CDCB; position: relative; }
img { display: block; width: 100%; }
figcaption { position: absolute; left: 0; top: 0; background: #1D221E; color: #F2F0E8; padding: 5px 12px 4px; font: 700 14px/1.3 'Noto Sans TC'; letter-spacing: .1em; }
figcaption i { font: 600 13px 'Saira Condensed'; font-style: normal; letter-spacing: .12em; margin-left: 8px; text-transform: uppercase; color: #C9CEB8; }
.strip { grid-column: span 2; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); border: 2px solid #1D221E; background: #F2F0E8; }
.strip div { padding: 0 22px; border-right: 2px solid #1D221E; border-bottom: 2px solid #1D221E; font: 500 15px/1.5 'Noto Sans TC'; color: #5A6158; display: flex; flex-direction: column; justify-content: center; }
.strip div:nth-child(2n) { border-right: 0; } .strip div:nth-child(n+5) { border-bottom: 0; }
.strip b { display: block; font: 400 40px/1.1 'Saira Stencil One'; color: #1D221E; letter-spacing: .02em; }
</style></head><body><div class="wrap">
